name: orbita
services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: orbita
      POSTGRES_PASSWORD: orbita_local_only
      POSTGRES_DB: orbita
    ports: ['127.0.0.1:54432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbita -d orbita']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:56379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
