name: Backend CI
on:
  push:
    branches: [codex/development, codex/production]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: orbita
          POSTGRES_PASSWORD: orbita_ci_only
          POSTGRES_DB: orbita_test
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U orbita -d orbita_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://orbita:orbita_ci_only@localhost:54329/orbita_test?schema=public
      TEST_REDIS_URL: redis://localhost:56379/1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run check
      - run: npm run test:db:migrate
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
